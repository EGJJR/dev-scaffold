[package]
name = "goldpath"
version = "0.1.0"
edition = "2021"
description = "Golden-path CLI that scaffolds services with secure defaults"
license = "MIT"
readme = "README.md"
repository = "https://github.com/EGJJR/goldpath"
homepage = "https://github.com/EGJJR/goldpath"
keywords = ["cli", "scaffold", "devtools", "golden-path"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "goldpath"
path = "src/lib.rs"

[[bin]]
name = "goldpath"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
indicatif = "0.17"
minijinja = "2"
rust-embed = "8"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
