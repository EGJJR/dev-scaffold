[package]
name = "{{ crate_name }}"
version = "0.1.0"
edition = "2021"
description = "HTTP service generated by dev-scaffold"

[dependencies]
axum = "0.8.4"
http = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.2", features = ["cors", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
